[workspace]

[package]
name = "mcp-news"
version = "1.4.0"
edition = "2024"
description = "Global news intelligence MCP server — real-time articles, trending topics, sentiment via GDELT (free) and NewsAPI"
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/mcp-news"
keywords = ["mcp", "news", "gdelt", "articles", "media"]
categories = ["api-bindings"]

[dependencies]
adk-mcp-sdk = "0.1"
rmcp = { version = "1.7", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
