[workspace]

[package]
name = "mcp-news"
version = "1.6.0"
edition = "2024"
rust-version = "1.94.1"
description = "Global news intelligence MCP server — real-time articles, trending topics, sentiment via GDELT (free) and NewsAPI"
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/mcp-news"
keywords = ["mcp", "news", "gdelt", "articles", "media"]
categories = ["api-bindings"]

[dependencies]
adk-mcp-sdk = { version = "0.2.0", git = "https://github.com/zavora-ai/adk-mcp-sdk.git", rev = "4dac4301441a8a51a042fd66cc1798f0ec3e3f55" }
rmcp = { version = "3.1.2", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
